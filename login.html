<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loopy | Login</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {
            --fundo: #fffaf6;
            --roxo: #401737;
            --coral: #f5685b;
            --texto: #655765;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--fundo);
            font-family: 'DM Sans', sans-serif;
            color: var(--roxo);
        }

        /* NAVBAR */

        .navbar {
            height: 74px;
            background-color: var(--fundo);
            border-bottom: 1px solid #eee3dc;
        }

        .navbar-container {
            max-width: 1480px;
            margin: auto;
        }

        .logo {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--roxo);
            text-decoration: none;
        }

        .logo span {
            color: var(--coral);
        }

        .btn-entrar-nav {
            color: var(--roxo);
            text-decoration: none;
            font-weight: 600;
            margin-right: 28px;
        }

        .btn-criar {
            background-color: var(--coral);
            color: white;
            padding: 11px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: .3s;
        }

        .btn-criar:hover {
            background-color: #e65348;
            color: white;
        }

        /* CONTEÚDO */

        .login-container {
            min-height: calc(100vh - 74px);
        }

        /* LADO ESQUERDO */

        .login-imagem-area {
            background-color: var(--fundo);
            padding: 24px 20px;
            min-height: calc(100vh - 74px);
        }

        .imagem-card {
            position: relative;
            height: calc(100vh - 122px);
            min-height: 550px;
            border-radius: 26px;
            overflow: hidden;
            background-image:
                linear-gradient(
                    to bottom,
                    rgba(42, 15, 38, 0.03) 25%,
                    rgba(42, 15, 38, 0.30) 55%,
                    rgba(42, 15, 38, 0.90) 100%
                ),
                url('https://images.unsplash.com/photo-1528605248644-14dd04022da1?w=1200&q=90');

            background-size: cover;
            background-position: center;
        }

        .logo-imagem {
            position: absolute;
            top: 38px;
            left: 38px;
            color: white;
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .logo-imagem span {
            color: var(--coral);
        }

        .frase-imagem {
            position: absolute;
            bottom: 38px;
            left: 38px;
            right: 35px;
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: clamp(25px, 2.7vw, 42px);
            font-weight: 700;
            line-height: 1.2;
        }

        /* LADO DIREITO */

        .login-form-area {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background-color: #fffdfb;
        }

        .login-form {
            width: 100%;
            max-width: 510px;
        }

        .login-subtitulo {
            color: var(--coral);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .login-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 800;
            line-height: 1.15;
            color: var(--roxo);
            margin-bottom: 8px;
        }

        .login-descricao {
            font-size: 16px;
            color: var(--texto);
            margin-bottom: 30px;
        }

        /* FORMULÁRIO */

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--roxo);
            margin-bottom: 8px;
        }

        .form-control {
            height: 53px;
            border: 1px solid #eadbd8;
            border-radius: 13px;
            background-color: white;
            padding: 12px 16px;
            font-size: 13px;
            color: var(--roxo);
            box-shadow: none;
        }

        .form-control:focus {
            border-color: var(--coral);
            box-shadow: 0 0 0 3px rgba(245, 104, 91, .10);
        }

        .form-control::placeholder {
            color: #938a96;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .esqueci-senha {
            display: block;
            text-align: right;
            color: var(--coral);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            margin-top: -7px;
            margin-bottom: 22px;
        }

        .esqueci-senha:hover {
            text-decoration: underline;
        }

        /* BOTÃO LOGIN */

        .btn-login {
            width: 100%;
            height: 49px;
            background-color: var(--coral);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            transition: .3s;
        }

        .btn-login:hover {
            background-color: #e65348;
            color: white;
        }

        .cadastro-texto {
            text-align: center;
            color: #827582;
            font-size: 12px;
            margin-top: 23px;
        }

        .cadastro-texto a {
            color: var(--coral);
            font-weight: 700;
            text-decoration: none;
        }

        .cadastro-texto a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 991px) {

            .login-imagem-area {
                min-height: 550px;
            }

            .imagem-card {
                height: 520px;
                min-height: auto;
            }

            .login-form-area {
                padding: 65px 35px;
            }

        }

        @media (max-width: 576px) {

            .navbar {
                height: 65px;
            }

            .logo {
                font-size: 25px;
            }

            .btn-entrar-nav {
                margin-right: 12px;
                font-size: 13px;
            }

            .btn-criar {
                padding: 9px 15px;
                font-size: 12px;
            }

            .login-imagem-area {
                min-height: auto;
                padding: 15px;
            }

            .imagem-card {
                height: 400px;
                min-height: auto;
                border-radius: 20px;
            }

            .logo-imagem {
                top: 25px;
                left: 25px;
                font-size: 25px;
            }

            .frase-imagem {
                left: 25px;
                right: 25px;
                bottom: 25px;
                font-size: 29px;
            }

            .login-form-area {
                padding: 50px 25px 60px;
            }

            .login-titulo {
                font-size: 35px;
            }

            .login-descricao {
                font-size: 14px;
            }

        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="container-fluid navbar-container px-4 px-lg-5 d-flex align-items-center justify-content-between">

            <a href="login.html" class="logo">
                loopy<span>.</span>
            </a>

            <div class="d-flex align-items-center">

                <a href="login.html" class="btn-entrar-nav">
                    Entrar
                </a>

                <a href="cadastro.html" class="btn-criar">
                    Criar conta
                </a>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO LOGIN -->

    <main class="container-fluid p-0">

        <div class="row g-0 login-container">

            <!-- LADO ESQUERDO: IMAGEM -->

            <div class="col-lg-5 login-imagem-area">

                <div class="imagem-card">

                    <div class="logo-imagem">
                        loopy<span>.</span>
                    </div>

                    <h2 class="frase-imagem">
                        “A melhor parte de conhecer alguém é descobrir tudo o que ainda não foi dito.”
                    </h2>

                </div>

            </div>


            <!-- LADO DIREITO: FORMULÁRIO -->

            <div class="col-lg-7 login-form-area">

                <div class="login-form">

                    <div class="login-subtitulo">
                        BEM-VINDO À LOOPY
                    </div>

                    <h1 class="login-titulo">
                        Que bom ter você de volta
                    </h1>

                    <p class="login-descricao">
                        Entre para continuar suas conversas.
                    </p>


                    <!-- FORMULÁRIO -->

                    <form action="#" method="POST">

                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email" class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="voce@email.com"
                                required
                            >

                        </div>


                        <!-- SENHA -->

                        <div class="form-group">

                            <label for="senha" class="form-label">
                                Senha
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                placeholder="Mínimo de 8 caracteres"
                                minlength="8"
                                required
                            >

                        </div>


                        <!-- ESQUECI SENHA -->

                        <a href="recuperar-senha.html" class="esqueci-senha">
                            Esqueci minha senha
                        </a>


                        <!-- BOTÃO -->

                        <button type="submit" class="btn btn-login">
                            Entrar
                        </button>


                        <!-- CADASTRO -->

                        <p class="cadastro-texto">
                            Ainda não tem uma conta?
                            <a href="cadastro.html">Criar agora</a>
                        </p>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
